server.port=8080
# ---- Database (PostgreSQL default; override with env vars) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/student_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# ---- JWT (secret must be >= 32 characters) ----
app.jwt.secret=${JWT_SECRET:change-this-super-secret-key-for-student-management-system-2026}
app.jwt.expiration-ms=86400000
# ---- Demo data (teacher + sample students inserted only if DB is empty) ----
app.seed=${SEED_DEMO_DATA:true}
